
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AURELIA & CO. | Bespoke Interior Architecture</title>
  <style>
    /* ----- RESET & BASE ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --gold: #c9a96e;
      --gold-light: #e8d5b0;
      --gold-dark: #8f6f3c;
      --charcoal: #0b0b0b;
      --charcoal-soft: #121212;
      --charcoal-mid: #1a1a1a;
      --text-light: #f0ede6;
      --text-muted: #b8b0a4;
      --line-subtle: rgba(201, 169, 110, 0.25);
      --transition-smooth: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    html {
      scroll-behavior: smooth;
      background: var(--charcoal);
    }

    body {
      font-family: 'Cormorant Garamond', 'Times New Roman', serif;
      background: var(--charcoal);
      color: var(--text-light);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
      position: relative;
      min-height: 100vh;
    }

    /* watermark overlay — visible, tasteful */
    body::before {
      content: "PREVIEW — UNLOCK FULL VERSION";
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-28deg);
      font-size: clamp(2rem, 7vw, 4.5rem);
      font-weight: 600;
      letter-spacing: 0.2em;
      color: rgba(201, 169, 110, 0.12);
      white-space: nowrap;
      pointer-events: none;
      z-index: 999;
      text-shadow: 0 0 15px rgba(0,0,0,0.3);
      font-family: 'Cormorant Garamond', serif;
      border: 2px solid rgba(201, 169, 110, 0.15);
      padding: 0.5rem 2rem;
      background: rgba(10, 10, 10, 0.2);
      backdrop-filter: blur(2px);
    }

    /* selection */
    ::selection {
      background: var(--gold);
      color: #0b0b0b;
    }

    /* ----- TYPOGRAPHY ----- */
    h1, h2, h3, h4 {
      font-weight: 400;
      letter-spacing: 0.02em;
    }

    h1 {
      font-size: clamp(2.8rem, 8vw, 5.5rem);
      line-height: 1.1;
      font-weight: 500;
      color: #fff;
      text-shadow: 0 2px 20px rgba(0,0,0,0.5);
    }

    h2 {
      font-size: clamp(2rem, 5vw, 3.4rem);
      margin-bottom: 1.5rem;
      color: var(--gold-light);
      position: relative;
      display: inline-block;
    }

    h2::after {
      content: '';
      display: block;
      width: 70px;
      height: 2px;
      background: var(--gold);
      margin-top: 0.6rem;
      transition: width 0.5s ease;
    }

    h2:hover::after {
      width: 120px;
    }

    .section-tag {
      font-size: 0.85rem;
      letter-spacing: 0.45em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 0.8rem;
      font-weight: 500;
    }

    /* ----- LAYOUT & CONTAINERS ----- */
    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    section {
      padding: 5rem 0;
      position: relative;
    }

    /* subtle gold divider */
    .divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      opacity: 0.4;
      margin: 0 auto;
    }

    /* ----- BUTTONS ----- */
    .btn {
      display: inline-block;
      padding: 1rem 2.8rem;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-decoration: none;
      transition: var(--transition-smooth);
      cursor: pointer;
      border: 1px solid var(--gold);
      background: transparent;
      color: var(--gold-light);
      font-weight: 500;
      position: relative;
      overflow: hidden;
    }

    .btn-gold {
      background: var(--gold);
      color: #0b0b0b;
      border: 1px solid var(--gold);
      font-weight: 600;
    }

    .btn-gold:hover {
      background: transparent;
      color: var(--gold-light);
      border-color: var(--gold-light);
    }

    .btn-outline:hover {
      background: rgba(201, 169, 110, 0.1);
      border-color: var(--gold-light);
      color: #fff;
    }

    /* ----- HEADER / NAV ----- */
    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 100;
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(11, 11, 11, 0.7);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-bottom: 1px solid rgba(201, 169, 110, 0.2);
      transition: var(--transition-smooth);
    }

    .logo {
      font-size: 1.8rem;
      letter-spacing: 0.3em;
      font-weight: 500;
      color: var(--gold-light);
      text-decoration: none;
    }

    .logo span {
      color: var(--gold);
      font-weight: 600;
    }

    .nav-links {
      display: flex;
      gap: 2.5rem;
      align-items: center;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.95rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      transition: color 0.3s;
      font-weight: 400;
    }

    .nav-links a:hover {
      color: var(--gold-light);
    }

    /* ----- HERO SECTION ----- */
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: radial-gradient(circle at 30% 40%, #1e1a14 0%, #0b0b0b 80%);
      padding: 8rem 2rem 4rem;
      position: relative;
      overflow: hidden;
    }

    .hero-content {
      max-width: 900px;
      z-index: 5;
      animation: fadeUp 1.2s ease-out;
    }

    .hero-sub {
      font-size: 1.25rem;
      color: var(--text-muted);
      max-width: 650px;
      margin: 1.5rem auto 2.5rem;
      letter-spacing: 0.04em;
      font-style: italic;
    }

    .hero-cta {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* Inline SVG artwork in hero */
    .hero-svg-art {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 45vh;
      z-index: 1;
      opacity: 0.5;
      pointer-events: none;
    }

    .hero-svg-art svg {
      width: 100%;
      height: 100%;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ----- ABOUT SECTION ----- */
    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
      align-items: center;
    }

    .about-text p {
      margin-bottom: 1.5rem;
      color: var(--text-muted);
      font-size: 1.15rem;
      line-height: 1.8;
    }

    .about-text .lead {
      font-size: 1.4rem;
      color: var(--gold-light);
      font-style: italic;
    }

    .about-image-placeholder {
      background: linear-gradient(145deg, #1e1a14, #0b0b0b);
      border: 1px solid var(--line-subtle);
      height: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 2px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
    }

    .about-image-placeholder::after {
      content: '✦';
      font-size: 5rem;
      color: var(--gold);
      opacity: 0.3;
    }

    /* ----- SERVICES SECTION ----- */
    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 2.5rem;
      margin-top: 3rem;
    }

    .service-card {
      background: var(--charcoal-soft);
      padding: 2.5rem 2rem;
      border: 1px solid var(--line-subtle);
      transition: var(--transition-smooth);
      position: relative;
    }

    .service-card:hover {
      transform: translateY(-8px);
      border-color: var(--gold);
      box-shadow: 0 15px 30px rgba(0,0,0,0.6);
    }

    .service-number {
      font-size: 2.5rem;
      color: var(--gold);
      opacity: 0.6;
      font-weight: 300;
      margin-bottom: 1rem;
    }

    .service-card h3 {
      font-size: 1.7rem;
      margin-bottom: 1rem;
      color: var(--gold-light);
    }

    .service-card p {
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1.7;
    }

    /* ----- TESTIMONIALS ----- */
    .testimonials-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2.5rem;
      margin-top: 3rem;
    }

    .testimonial-card {
      background: var(--charcoal-mid);
      padding: 2.5rem 2rem;
      border-left: 3px solid var(--gold);
      font-style: italic;
      color: var(--text-muted);
      transition: var(--transition-smooth);
    }

    .testimonial-card:hover {
      background: #1f1d1a;
      border-left-color: var(--gold-light);
    }

    .testimonial-card p {
      font-size: 1.1rem;
      line-height: 1.8;
      margin-bottom: 1.5rem;
    }

    .testimonial-author {
      font-style: normal;
      font-weight: 600;
      color: var(--gold-light);
      letter-spacing: 0.05em;
    }

    /* ----- CONTACT / CTA ----- */
    .contact-section {
      background: radial-gradient(circle at 50% 0%, #1a1611, #0b0b0b);
      text-align: center;
    }

    .contact-details {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 3rem;
      margin: 3rem 0 2rem;
      color: var(--text-muted);
    }

    .contact-item {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .contact-item strong {
      color: var(--gold-light);
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-size: 0.9rem;
    }

    .contact-item span {
      font-size: 1.1rem;
    }

    /* ----- FOOTER ----- */
    .site-footer {
      text-align: center;
      padding: 2rem;
      border-top: 1px solid var(--line-subtle);
      color: var(--text-muted);
      font-size: 0.9rem;
      letter-spacing: 0.1em;
    }

    /* ----- RESPONSIVE ----- */
    @media (max-width: 768px) {
      .site-header {
        flex-direction: column;
        gap: 0.8rem;
        padding: 1rem;
      }
      .nav-links {
        gap: 1.5rem;
        flex-wrap: wrap;
        justify-content: center;
      }
      .about-grid {
        grid-template-columns: 1fr;
        gap: 2rem;
      }
      .hero {
        padding: 7rem 1.5rem 3rem;
      }
      .hero-cta {
        flex-direction: column;
        align-items: center;
      }
      .btn {
        width: 100%;
        max-width: 300px;
        text-align: center;
      }
      section {
        padding: 3.5rem 0;
      }
      .container {
        padding: 0 1.5rem;
      }
    }

    @media (max-width: 480px) {
      .logo {
        font-size: 1.4rem;
        letter-spacing: 0.2em;
      }
      .nav-links a {
        font-size: 0.8rem;
      }
      .contact-details {
        flex-direction: column;
        gap: 1.5rem;
      }
    }

    /* subtle animation for cards */
    .service-card, .testimonial-card {
      animation: fadeUp 0.8s ease-out both;
    }
    .service-card:nth-child(2) { animation-delay: 0.1s; }
    .service-card:nth-child(3) { animation-delay: 0.2s; }
    .service-card:nth-child(4) { animation-delay: 0.3s; }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <a href="#" class="logo">AURELIA <span>&</span> CO.</a>
    <nav class="nav-links">
      <a href="#about">About</a>
      <a href="#services">Services</a>
      <a href="#testimonials">Stories</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <!-- HERO SECTION with inline SVG artwork -->
  <section class="hero" id="hero">
    <div class="hero-content">
      <div class="section-tag" style="color: var(--gold);">Beverly Hills · Interior Architecture</div>
      <h1>Where Architecture<br>Wears Couture.</h1>
      <p class="hero-sub">Aurelia & Co. crafts bespoke residential sanctuaries for those who view privacy as the ultimate luxury.</p>
      <div class="hero-cta">
        <a href="#contact" class="btn btn-gold">Request a Private Consultation</a>
        <a href="#services" class="btn btn-outline">Explore the Portfolio</a>
      </div>
    </div>

    <!-- Inline SVG artwork (abstract gold lines / architectural motif) -->
    <div class="hero-svg-art">
      <svg viewBox="0 0 1200 400" preserveAspectRatio="xMidYMax meet" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#c9a96e" stop-opacity="0.8"/>
            <stop offset="50%" stop-color="#e8d5b0" stop-opacity="0.5"/>
            <stop offset="100%" stop-color="#8f6f3c" stop-opacity="0.2"/>
          </linearGradient>
        </defs>
        <!-- elegant arcs and lines -->
        <path d="M0,350 Q300,200 600,300 T1200,250" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.7"/>
