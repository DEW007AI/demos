
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>DC VA Counseling Psychotherapy · Clarity is the New Currency</title>
    <style>
        /* ===== RESET & BASE ===== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #c9a962;
            --gold-light: #e8d5a3;
            --gold-dark: #9a7b3c;
            --black: #0a0a0a;
            --black-soft: #111111;
            --black-raise: #1a1a1a;
            --ivory: #f5f1e8;
            --ivory-muted: #d9d2c5;
            --text-muted: #b8b0a0;
            --watermark-color: rgba(201, 169, 98, 0.12);
            --serif: 'Cormorant Garamond', 'Times New Roman', serif;
            --sans: 'Inter', 'Helvetica Neue', Arial, sans-serif;
            --transition: 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        html {
            scroll-behavior: smooth;
            background: var(--black);
        }

        body {
            background: var(--black);
            color: var(--ivory);
            font-family: var(--sans);
            font-weight: 300;
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            position: relative;
            min-height: 100vh;
        }

        /* ===== WATERMARK OVERLAY (visible but tasteful) ===== */
        body::after {
            content: "PREVIEW — UNLOCK FULL VERSION";
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-20deg);
            font-size: clamp(1.8rem, 6vw, 4.5rem);
            font-weight: 700;
            letter-spacing: 0.3em;
            color: var(--watermark-color);
            white-space: nowrap;
            pointer-events: none;
            z-index: 9999;
            text-transform: uppercase;
            font-family: var(--sans);
            border: 2px solid rgba(201, 169, 98, 0.15);
            padding: 1rem 2rem;
            backdrop-filter: blur(2px);
            background: rgba(10, 10, 10, 0.05);
            box-shadow: 0 0 40px rgba(0,0,0,0.3);
            transition: opacity 0.3s;
            opacity: 0.9;
        }

        /* ===== TYPOGRAPHY ===== */
        h1, h2, h3, h4, .serif {
            font-family: var(--serif);
            font-weight: 500;
            letter-spacing: 0.02em;
            line-height: 1.2;
        }

        h2 {
            font-size: clamp(2.2rem, 5vw, 3.8rem);
            margin-bottom: 1.5rem;
            color: var(--gold-light);
            position: relative;
            display: inline-block;
        }

        h2::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 60px;
            height: 2px;
            background: var(--gold);
            transition: width 0.6s ease;
        }

        h2:hover::after {
            width: 100px;
        }

        .section-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            color: var(--gold);
            margin-bottom: 0.8rem;
            font-weight: 400;
        }

        /* ===== LAYOUT ===== */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        section {
            padding: 5rem 0;
            position: relative;
        }

        .gold-divider {
            width: 80px;
            height: 1px;
            background: var(--gold);
            margin: 2rem 0;
        }

        /* ===== BUTTONS ===== */
        .btn {
            display: inline-block;
            padding: 1rem 2.4rem;
            font-family: var(--sans);
            font-weight: 500;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            text-decoration: none;
            transition: var(--transition);
            cursor: pointer;
            border: 1px solid transparent;
            background: transparent;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: var(--gold);
            color: var(--black);
            border-color: var(--gold);
        }

        .btn-primary:hover {
            background: transparent;
            color: var(--gold);
            border-color: var(--gold);
            box-shadow: 0 0 30px rgba(201, 169, 98, 0.3);
        }

        .btn-secondary {
            border-color: var(--gold);
            color: var(--gold);
        }

        .btn-secondary:hover {
            background: var(--gold);
            color: var(--black);
            box-shadow: 0 0 30px rgba(201, 169, 98, 0.4);
        }

        /* ===== NAVIGATION ===== */
        .nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 10, 10, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(201, 169, 98, 0.15);
            transition: var(--transition);
        }

        .nav-logo {
            font-family: var(--serif);
            font-size: 1.5rem;
            font-weight: 500;
            color: var(--gold-light);
            letter-spacing: 0.05em;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            align-items: center;
        }

        .nav-links a {
            color: var(--ivory-muted);
            text-decoration: none;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            transition: color 0.3s;
            font-weight: 400;
        }

        .nav-links a:hover {
            color: var(--gold);
        }

        .nav-cta {
            border: 1px solid var(--gold);
            padding: 0.6rem 1.4rem;
            color: var(--gold) !important;
            transition: var(--transition);
        }

        .nav-cta:hover {
            background: var(--gold);
            color: var(--black) !important;
        }

        /* ===== HERO ===== */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            position: relative;
            background: radial-gradient(ellipse at 30% 40%, #1a1a1a 0%, #0a0a0a 70%);
            padding-top: 5rem;
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            align-items: center;
            width: 100%;
        }

        .hero-content h1 {
            font-size: clamp(3rem, 8vw, 5.5rem);
            color: var(--gold-light);
            margin-bottom: 1.5rem;
            line-height: 1.1;
        }

        .hero-content .subheadline {
            font-size: 1.1rem;
            color: var(--ivory-muted);
            max-width: 500px;
            margin-bottom: 2.5rem;
            font-weight: 300;
            letter-spacing: 0.02em;
        }

        .hero-actions {
            display: flex;
            gap: 1.2rem;
            flex-wrap: wrap;
        }

        .hero-art {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .hero-art svg {
            width: 100%;
            max-width: 500px;
            height: auto;
            filter: drop-shadow(0 0 40px rgba(201, 169, 98, 0.2));
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        /* ===== ABOUT ===== */
        .about {
            background: var(--black-soft);
            border-top: 1px solid rgba(201, 169, 98, 0.1);
            border-bottom: 1px solid rgba(201, 169, 98, 0.1);
        }

        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: start;
        }

        .about-text p {
            margin-bottom: 1.5rem;
            color: var(--ivory-muted);
            font-size: 1.05rem;
            font-weight: 300;
        }

        .about-quote {
            font-family: var(--serif);
            font-size: 1.8rem;
            color: var(--gold);
            line-height: 1.4;
            margin-top: 2rem;
            padding-left: 1.5rem;
            border-left: 2px solid var(--gold);
            font-style: italic;
        }

        /* ===== SERVICES ===== */
        .services {
            background: var(--black);
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            margin-top: 3rem;
        }

        .service-card {
            background: var(--black-raise);
            border: 1px solid rgba(201, 169, 98, 0.15);
            padding: 2.5rem 2rem;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .service-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--gold);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.5s ease;
        }

        .service-card:hover::before {
            transform: scaleX(1);
        }

        .service-card:hover {
            border-color: var(--gold);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            transform: translateY(-5px);
        }

        .service-number {
            font-size: 0.75rem;
            color: var(--gold);
            letter-spacing: 0.25em;
            margin-bottom: 1rem;
            font-weight: 500;
        }

        .service-card h3 {
            font-size: 1.6rem;
            color: var(--gold-light);
            margin-bottom: 1rem;
        }

        .service-card p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.7;
        }

        /* ===== TESTIMONIALS ===== */
        .testimonials {
            background: var(--black-soft);
            border-top: 1px solid rgba(201, 169, 98, 0.1);
            border-bottom: 1px solid rgba(201, 169, 98, 0.1);
        }

        .testimonial-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-top: 3rem;
        }

        .testimonial-card {
            background: var(--black-raise);
            padding: 2.5rem 2rem;
            border: 1px solid rgba(201, 169, 98, 0.1);
            transition: var(--transition);
            position: relative;
        }

        .testimonial-card:hover {
            border-color: var(--gold);
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }

        .testimonial-card .quote-mark {
            font-size: 4rem;
            color: var(--gold);
            opacity: 0.4;
            line-height: 1;
            margin-bottom: 0.5rem;
            font-family: var(--serif);
        }

        .testimonial-card blockquote {
            font-style: italic;
            color: var(--ivory-muted);
            font-size: 1rem;
            line-height: 1.8;
            margin-bottom: 1.5rem;
            font-weight: 300;
        }

        .testimonial-author {
            color: var(--gold);
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            font-weight: 500;
            text-transform: uppercase;
        }

        /* ===== CONTACT ===== */
        .contact {
            background: var(--black);
        }

        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
        }

        .contact-info h2 {
            margin-bottom: 1rem;
        }

        .contact-info p {
            color: var(--ivory-muted);
            margin-bottom: 2rem;
            font-size: 1.05rem;
        }

        .contact-details {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            margin-top: 2rem;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            color: var(--ivory-muted);
            text-decoration: none;
            transition: color 0.3s;
        }

        .contact-item:hover {
            color: var(--gold);
        }

        .contact-item .icon {
            width: 40px;
            height: 40px;
            border: 1px solid var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold);
            flex-shrink: 0;
        }

        .contact-form {
            background: var(--black-raise);
            padding: 3rem;
            border: 1px solid rgba(201, 169, 98, 0.2);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--gold);
            margin-bottom: 0.5rem;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.9rem 1rem;
            background: var(--black);
            border: 1px solid rgba(201, 169, 98, 0.25);
            color: var(--ivory);
            font-family: var(--sans);
            font-size: 0.95rem;
            transition: border-color 0.3s;
            outline: none;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--gold);
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        .privacy-note {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 1rem;
            letter-spacing: 0.05em;
            text-align: center;
        }

        /* ===== FOOTER ===== */
        .footer {
            background: var(--black-soft);
            padding: 2.5rem 0;
            border-top: 1px solid rgba(201, 169, 98, 0.1);
            text-align: center;
        }

        .footer p {
            color: var(--text-muted);
            font-size: 0.8rem;
            letter-spacing: 0.05em;
        }

        /* ===== ANIMATIONS ===== */
        .fade-in {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 992px) {
            .hero-grid,
            .about-grid,
            .contact-grid {
                grid-template-columns: 1fr
