
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MAISON MIRABEAU — Luxury Atelier</title>
  <style>
    /* ----- RESET & BASE ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --gold: #c9a96e;
      --gold-light: #e8d5a3;
      --gold-dark: #a08040;
      --black: #0c0a08;
      --black-soft: #14110d;
      --charcoal: #1d1915;
      --ivory: #f5f0e8;
      --smoke: #d9d0c0;
      --muted: #9a8f7d;
      --serif: 'Cormorant Garamond', 'Times New Roman', serif;
      --sans: 'Jost', 'Montserrat', 'Helvetica Neue', sans-serif;
      --shadow-gold: 0 8px 30px rgba(201, 169, 110, 0.15);
      --transition: 0.45s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    html {
      scroll-behavior: smooth;
      background: var(--black);
    }

    body {
      background: var(--black);
      color: var(--ivory);
      font-family: var(--sans);
      font-weight: 300;
      line-height: 1.6;
      letter-spacing: 0.02em;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ----- TYPOGRAPHY ----- */
    h1, h2, h3, h4, .serif {
      font-family: var(--serif);
      font-weight: 400;
      letter-spacing: 0.04em;
    }

    h1 {
      font-size: clamp(2.8rem, 8vw, 5.5rem);
      line-height: 1.1;
      font-weight: 400;
      color: var(--ivory);
      text-shadow: 0 2px 15px rgba(0,0,0,0.5);
    }

    h2 {
      font-size: clamp(2rem, 5vw, 3.4rem);
      line-height: 1.2;
      color: var(--gold-light);
      margin-bottom: 1rem;
    }

    h3 {
      font-size: clamp(1.4rem, 3vw, 2rem);
      color: var(--gold);
      margin-bottom: 0.75rem;
      font-weight: 400;
    }

    .eyebrow {
      font-family: var(--sans);
      text-transform: uppercase;
      letter-spacing: 0.5em;
      font-size: 0.75rem;
      font-weight: 400;
      color: var(--gold);
      margin-bottom: 1.5rem;
      display: inline-block;
      border-bottom: 1px solid rgba(201,169,110,0.4);
      padding-bottom: 0.5rem;
    }

    .section-title {
      font-size: 0.8rem;
      letter-spacing: 0.45em;
      text-transform: uppercase;
      color: var(--gold-dark);
      margin-bottom: 0.5rem;
      font-weight: 400;
    }

    /* ----- LAYOUT & CONTAINERS ----- */
    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    section {
      padding: 6rem 0;
      position: relative;
    }

    .gold-divider {
      width: 80px;
      height: 1px;
      background: var(--gold);
      margin: 2rem 0;
      opacity: 0.7;
    }

    /* ----- WATERMARK OVERLAY (visible, tasteful) ----- */
    .watermark-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      mix-blend-mode: overlay;
      opacity: 0.35;
    }

    .watermark-overlay span {
      font-family: var(--sans);
      font-size: clamp(1.2rem, 4vw, 2.5rem);
      letter-spacing: 0.6em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 400;
      transform: rotate(-30deg);
      white-space: nowrap;
      text-shadow: 0 0 20px rgba(0,0,0,0.8);
      border: 1px solid rgba(201,169,110,0.5);
      padding: 1.2rem 3rem;
      backdrop-filter: blur(2px);
      background: rgba(10,8,5,0.2);
    }

    /* ----- BUTTONS & LINKS ----- */
    .btn {
      display: inline-block;
      padding: 1rem 2.8rem;
      font-family: var(--sans);
      text-transform: uppercase;
      letter-spacing: 0.25em;
      font-size: 0.8rem;
      font-weight: 400;
      text-decoration: none;
      transition: var(--transition);
      border: 1px solid var(--gold);
      color: var(--gold);
      background: transparent;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .btn-gold {
      background: var(--gold);
      color: var(--black);
      border: 1px solid var(--gold);
      font-weight: 500;
    }

    .btn-gold:hover {
      background: transparent;
      color: var(--gold);
      box-shadow: var(--shadow-gold);
    }

    .btn-outline:hover {
      background: rgba(201,169,110,0.1);
      box-shadow: var(--shadow-gold);
    }

    .text-link {
      color: var(--gold-light);
      text-decoration: none;
      border-bottom: 1px solid rgba(201,169,110,0.5);
      transition: var(--transition);
      letter-spacing: 0.15em;
      font-size: 0.85rem;
      text-transform: uppercase;
    }

    .text-link:hover {
      color: var(--gold);
      border-bottom-color: var(--gold);
    }

    /* ----- NAVIGATION (minimal) ----- */
    .nav-lux {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      background: linear-gradient(to bottom, rgba(12,10,8,0.9), rgba(12,10,8,0));
      transition: var(--transition);
    }

    .nav-brand {
      font-family: var(--serif);
      font-size: 1.6rem;
      letter-spacing: 0.2em;
      color: var(--gold-light);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 2.5rem;
    }

    .nav-links a {
      color: var(--smoke);
      text-decoration: none;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      transition: var(--transition);
    }

    .nav-links a:hover {
      color: var(--gold);
    }

    /* ----- HERO SECTION ----- */
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: var(--black);
      position: relative;
      padding: 8rem 2rem 4rem;
      overflow: hidden;
    }

    .hero-svg-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      opacity: 0.3;
      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 900px;
    }

    .hero-actions {
      display: flex;
      gap: 2rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 2.5rem;
    }

    /* ----- ABOUT SECTION ----- */
    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
      align-items: center;
    }

    .about-text p {
      margin-bottom: 1.5rem;
      color: var(--smoke);
      font-size: 1.05rem;
      line-height: 1.8;
    }

    .about-ornament {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 300px;
    }

    /* ----- SERVICES SECTION ----- */
    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 2.5rem;
      margin-top: 3rem;
    }

    .service-card {
      background: var(--black-soft);
      border: 1px solid rgba(201,169,110,0.2);
      padding: 2.5rem 2rem;
      transition: var(--transition);
      position: relative;
    }

    .service-card:hover {
      border-color: var(--gold);
      transform: translateY(-5px);
      box-shadow: var(--shadow-gold);
    }

    .service-card h4 {
      font-family: var(--serif);
      font-size: 1.7rem;
      color: var(--gold-light);
      margin-bottom: 1rem;
      font-weight: 400;
    }

    .service-card p {
      color: var(--smoke);
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }

    .service-feature {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--gold);
      border-top: 1px solid rgba(201,169,110,0.3);
      padding-top: 1rem;
    }

    /* ----- TESTIMONIALS SECTION ----- */
    .testimonials-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 2.5rem;
      margin-top: 3rem;
    }

    .testimonial-card {
      background: transparent;
      border-left: 2px solid var(--gold-dark);
      padding: 1.5rem 2rem;
      transition: var(--transition);
    }

    .testimonial-card:hover {
      border-left-color: var(--gold);
      background: rgba(201,169,110,0.03);
    }

    .testimonial-quote {
      font-family: var(--serif);
      font-style: italic;
      font-size: 1.2rem;
      color: var(--ivory);
      line-height: 1.7;
      margin-bottom: 1.5rem;
    }

    .testimonial-author {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--gold);
    }

    /* ----- CONTACT SECTION ----- */
    .contact-wrapper {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
      align-items: center;
    }

    .contact-info p {
      margin-bottom: 1.2rem;
      color: var(--smoke);
      font-size: 1.05rem;
    }

    .contact-detail {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
      color: var(--gold-light);
    }

    .contact-detail strong {
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-size: 0.8rem;
      min-width: 90px;
    }

    .footer-note {
      margin-top: 3rem;
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: center;
      border-top: 1px solid rgba(201,169,110,0.2);
      padding-top: 2rem;
    }

    /* ----- ANIMATIONS (subtle) ----- */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .animate-in {
      animation: fadeInUp 0.8s ease forwards;
    }

    .delay-1 { animation-delay: 0.15s; }
    .delay-2 { animation-delay: 0.3s; }
    .delay-3 { animation-delay: 0.45s; }

    /* ----- RESPONSIVE ----- */
    @media (max-width: 768px) {
      section { padding: 4rem 0; }
      .container { padding: 0 1.5rem; }
      .about-grid, .contact-wrapper { grid-template-columns: 1fr; gap: 2rem; }
      .nav-links { display: none; }
      .hero { padding: 6rem 1.5rem 3rem; }
      .hero-actions { flex-direction: column; align-items: center; }
      .watermark-overlay span { font-size: 1rem; letter-spacing: 0.3em; padding: 0.8rem 1.5rem; }
    }

    @media (max-width: 480px) {
      h1 { font-size: 2.5rem; }
      .btn { padding: 0.8rem 1.8rem; font-size: 0.7rem; }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

  <!-- TASTEFUL WATERMARK OVERLAY -->
  <div class="watermark-overlay" aria-hidden="true">
    <span>PREVIEW — UNLOCK FULL VERSION</span>
  </div>

  <!-- NAVIGATION -->
  <nav class="nav-lux">
    <a href="#" class="nav-brand">MAISON MIRABEAU</a>
    <div class="nav-links">
      <a href="#about">Heritage</a>
      <a href="#services">Craft</a>
      <a href="#testimonials">Voices</a>
      <a href="#contact">Invitation</a>
    </div>
  </nav>

  <!-- HERO SECTION -->
  <section class="hero" id="hero">
    <!-- Inline SVG artwork background -->
    <svg class="hero-svg-bg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="goldGlow" cx="50%" cy="45%" r="60%">
          <stop offset="0%" stop-color="#c9a96e" stop-opacity="0.15" />
          <stop offset="70%" stop-color="#0c0a08" stop-opacity="0.8" />
          <stop offset="100%" stop-color="#0c0a08" stop-opacity="1" />
        </radialGradient>
        <pattern id="subtleGrid" width="60" height="60" patternUnits="userSpaceOnUse">
          <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#c9a96e" stroke-width="0.3" opacity="0.15"/>
        </pattern>
      </defs>
      <rect width="1200" height="800" fill="url(#goldGlow)"/>
      <rect width="1200" height="800" fill="url(#subtleGrid)"/>
      <circle cx="600" cy="380" r="220" fill="none" stroke="#c9a96e" stroke-width="0.8" opacity="0.2"/>
      <circle cx="600" cy="380" r="280" fill="none" stroke="#c9a96e" stroke-width="0.4" opacity="0.15"/>
      <path d="M300 500 Q600 200 900 500" fill="none" stroke="#c9a96e" stroke-width="0.6" opacity="0.25"/>
      <path d="M200 600 Q600 300 1000 600" fill="none" stroke="#c9a96e" stroke-width="0.3" opacity="0.15"/>
    </svg>

    <div class="hero-content">
      <div class="eyebrow animate-in
