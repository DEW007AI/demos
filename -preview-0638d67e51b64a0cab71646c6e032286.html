
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>OBSIDIAN & OAK | Bespoke Interior Architecture</title>
  <style>
    /* ----- RESET & BASE ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --gold: #c9a962;
      --gold-light: #e5cf9f;
      --gold-dark: #9a7b3f;
      --black: #0a0a0a;
      --charcoal: #111111;
      --graphite: #1a1a1a;
      --smoke: #2a2a2a;
      --ivory: #f5f1e8;
      --stone: #d9d2c5;
      --shadow: rgba(0, 0, 0, 0.6);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --font-display: 'Cormorant Garamond', 'Times New Roman', serif;
      --font-body: 'Jost', 'Montserrat', 'Helvetica Neue', sans-serif;
    }

    html {
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background-color: var(--black);
      color: var(--ivory);
      font-family: var(--font-body);
      font-weight: 300;
      line-height: 1.6;
      overflow-x: hidden;
      letter-spacing: 0.02em;
    }

    /* ----- TYPOGRAPHY ----- */
    h1, h2, h3, h4, .serif {
      font-family: var(--font-display);
      font-weight: 400;
      letter-spacing: 0.04em;
      line-height: 1.2;
    }

    h1 {
      font-size: clamp(3rem, 10vw, 6.5rem);
      font-weight: 400;
      color: var(--gold-light);
      text-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
    }

    h2 {
      font-size: clamp(2.2rem, 6vw, 4rem);
      margin-bottom: 1.5rem;
      color: var(--gold);
    }

    h3 {
      font-size: clamp(1.6rem, 3.5vw, 2.4rem);
      font-weight: 400;
      color: var(--gold-light);
      margin-bottom: 0.8rem;
    }

    .section-tag {
      font-family: var(--font-body);
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.5em;
      font-size: 0.75rem;
      color: var(--gold);
      margin-bottom: 1.2rem;
      display: block;
    }

    p {
      color: #cbc3b4;
      font-weight: 300;
      max-width: 720px;
      margin-bottom: 1.5rem;
    }

    .gold-text {
      color: var(--gold);
    }

    /* ----- LAYOUT & CONTAINER ----- */
    .container {
      width: 100%;
      max-width: 1320px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    section {
      position: relative;
      padding: 6rem 0;
    }

    /* ----- WATERMARK OVERLAY (visible but tasteful) ----- */
    .watermark-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      mix-blend-mode: overlay;
    }

    .watermark-overlay span {
      font-family: var(--font-body);
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.8em;
      font-size: clamp(0.9rem, 2.5vw, 1.6rem);
      color: rgba(201, 169, 98, 0.22);
      text-shadow: 0 0 12px rgba(0, 0, 0, 0.4);
      transform: rotate(-12deg);
      white-space: nowrap;
      background: rgba(10, 10, 10, 0.2);
      padding: 0.8rem 2rem;
      border: 1px solid rgba(201, 169, 98, 0.15);
      backdrop-filter: blur(2px);
      border-radius: 2px;
    }

    /* ----- BUTTONS & LINKS ----- */
    .btn {
      display: inline-block;
      font-family: var(--font-body);
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      font-size: 0.8rem;
      padding: 1rem 2.8rem;
      border: 1px solid var(--gold);
      color: var(--gold-light);
      background: transparent;
      cursor: pointer;
      transition: all 0.45s var(--ease);
      text-decoration: none;
      margin: 0.4rem 0.5rem;
      position: relative;
      overflow: hidden;
      border-radius: 2px;
    }

    .btn:hover {
      background: var(--gold);
      color: var(--black);
      border-color: var(--gold);
      box-shadow: 0 8px 30px rgba(201, 169, 98, 0.25);
      transform: translateY(-2px);
    }

    .btn-outline {
      background: transparent;
      border-color: rgba(201, 169, 98, 0.6);
    }

    .btn-outline:hover {
      background: rgba(201, 169, 98, 0.1);
      color: var(--gold-light);
      border-color: var(--gold);
    }

    /* ----- NAVIGATION ----- */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      background: rgba(10, 10, 10, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(201, 169, 98, 0.2);
      transition: background 0.4s ease;
    }

    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.2rem 2rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    .logo {
      font-family: var(--font-display);
      font-size: 1.8rem;
      letter-spacing: 0.15em;
      color: var(--gold-light);
      text-decoration: none;
      font-weight: 400;
    }

    .nav-links {
      display: flex;
      gap: 2.5rem;
      align-items: center;
    }

    .nav-links a {
      color: #cfc7b8;
      text-decoration: none;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      transition: color 0.3s ease;
      font-weight: 400;
    }

    .nav-links a:hover {
      color: var(--gold);
    }

    /* ----- HERO SECTION with inline SVG artwork ----- */
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      background: radial-gradient(ellipse at 30% 40%, #1a1a1a 0%, #0a0a0a 70%);
      padding: 8rem 1rem 4rem;
      overflow: hidden;
    }

    .hero-svg-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .hero-svg-container svg {
      width: 100%;
      height: 100%;
      opacity: 0.5;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 900px;
    }

    .hero h1 {
      margin-bottom: 1.5rem;
    }

    .hero .subheadline {
      font-size: 1.2rem;
      font-weight: 300;
      color: #d6cdbc;
      max-width: 650px;
      margin: 0 auto 2.5rem;
      letter-spacing: 0.05em;
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
    }

    /* ----- ABOUT SECTION ----- */
    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
      align-items: center;
    }

    .about-text {
      padding-right: 1rem;
    }

    .about-visual {
      background: var(--graphite);
      border: 1px solid rgba(201, 169, 98, 0.3);
      padding: 2rem;
      border-radius: 2px;
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
    }

    .about-visual::after {
      content: '';
      position: absolute;
      top: -30%;
      right: -20%;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(201, 169, 98, 0.15), transparent 70%);
      border-radius: 50%;
    }

    .about-visual svg {
      width: 100%;
      height: auto;
      display: block;
      opacity: 0.9;
    }

    /* ----- SERVICES SECTION ----- */
    .services-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2rem;
      margin-top: 3rem;
    }

    .service-card {
      background: var(--charcoal);
      border: 1px solid rgba(201, 169, 98, 0.2);
      padding: 2.5rem 2rem;
      border-radius: 2px;
      transition: all 0.5s var(--ease);
      position: relative;
      overflow: hidden;
    }

    .service-card:hover {
      transform: translateY(-8px);
      border-color: var(--gold);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .service-card .service-icon {
      font-size: 2.5rem;
      color: var(--gold);
      margin-bottom: 1.5rem;
      display: block;
    }

    .service-card h4 {
      font-size: 1.5rem;
      margin-bottom: 0.8rem;
      color: var(--gold-light);
    }

    .service-card .service-sub {
      font-style: italic;
      color: var(--gold);
      margin-bottom: 1rem;
      font-family: var(--font-display);
      font-size: 1.2rem;
    }

    /* ----- TESTIMONIALS ----- */
    .testimonials-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2rem;
      margin-top: 3rem;
    }

    .testimonial-card {
      background: var(--charcoal);
      padding: 2.5rem 2rem;
      border-left: 3px solid var(--gold);
      border-radius: 2px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      transition: all 0.4s ease;
    }

    .testimonial-card:hover {
      border-left-color: var(--gold-light);
      background: #181818;
    }

    .testimonial-card p {
      font-style: italic;
      color: #e0d8ca;
      font-weight: 300;
      margin-bottom: 1.5rem;
      font-size: 1rem;
    }

    .testimonial-author {
      color: var(--gold);
      font-weight: 400;
      letter-spacing: 0.05em;
      font-size: 0.9rem;
    }

    /* ----- CONTACT SECTION ----- */
    .contact-wrapper {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
      align-items: start;
    }

    .contact-info {
      background: var(--charcoal);
      padding: 2.5rem;
      border: 1px solid rgba(201, 169, 98, 0.25);
      border-radius: 2px;
    }

    .contact-info p {
      margin-bottom: 1rem;
      color: #d4ccbc;
    }

    .contact-detail {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.2rem;
      color: var(--gold-light);
    }

    .contact-detail svg {
      flex-shrink: 0;
    }

    .contact-form {
      background: var(--charcoal);
      padding: 2.5rem;
      border: 1px solid rgba(201, 169, 98, 0.25);
      border-radius: 2px;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      font-size: 0.7rem;
      color: var(--gold);
      margin-bottom: 0.5rem;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      background: #1e1e1e;
      border: 1px solid #3a3a3a;
      padding: 0.9rem 1.2rem;
      color: var(--ivory);
      font-family: var(--font-body);
      font-weight: 300;
      border-radius: 2px;
      transition: border 0.3s;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--gold);
    }

    .form-group textarea {
      min-height: 120px;
      resize: vertical;
    }

    /* ----- FOOTER ----- */
    footer {
      background: #050505;
      padding: 3rem 0;
      border-top: 1px solid rgba(201, 169, 98, 0.15);
      text-align: center;
    }

    footer p {
      font-size: 0.8rem;
      color: #8a8376;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    /* ----- ANIMATIONS ----- */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .fade-in {
      animation: fadeUp 1s var(--ease) forwards;
      opacity: 0;
    }

    .delay-1 { animation-delay: 0.2s; }
    .delay-2 { animation-delay: 0.4s; }
    .delay-3 { animation-delay: 0.6s; }
    .delay-4 { animation-delay: 0.8s; }

    /* ----- RESPONSIVE ----- */
    @media (max-width: 1024px) {
      .services-grid, .testimonials-grid {
        grid-template-columns: 1fr 1fr;
      }
      .about-grid, .contact-wrapper {
        grid-template-columns: 1fr;
        gap: 2rem;
      }
    }

    @media (max-width: 768px) {
      .nav-inner {
        flex-direction: column;
        gap: 0.8rem;
        padding: 1rem;
      }
      .nav-links {
        gap: 1.2rem;
        flex-wrap: wrap;
        justify-content: center;
      }
      .nav-links a {
        font-size: 0.7rem;
        letter-spacing: 0.1em;
      }
      section {
        padding: 4rem 0;
      }
      .services-grid, .testimonials-grid {
        grid-template-columns: 1fr;
      }
      .hero h1 {
        font-size: 2.8rem;
      }
      .btn {
        padding: 0.8rem 1.8rem;
        font-size: 0.7rem;
        margin: 0.3rem;
      }
      .watermark-overlay span {
        letter-spacing: 0.3em;
        font-size: 0.7rem;
        padding: 0.5rem 1rem;
      }
    }

    @media (max-width: 480px) {
