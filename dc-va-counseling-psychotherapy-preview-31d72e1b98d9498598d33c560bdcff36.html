<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>DC VA Counseling Psychotherapy | The Art of Emotional Mastery</title>
  <style>
    /* ----- RESET & BASE ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --gold: #c9a962;
      --gold-light: #e8d5a3;
      --gold-dark: #a07f3c;
      --black: #0a0a0a;
      --black-soft: #111111;
      --black-card: #161616;
      --gray-mist: #b8b0a4;
      --white: #f5f0e6;
      --shadow-gold: 0 20px 40px -12px rgba(201, 169, 98, 0.15);
      --transition: 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    html {
      scroll-behavior: smooth;
      background: var(--black);
    }

    body {
      font-family: 'Cormorant Garamond', 'Times New Roman', serif;
      background: var(--black);
      color: var(--white);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
      position: relative;
      min-height: 100vh;
    }

    /* subtle grain overlay */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 30% 20%, rgba(201, 169, 98, 0.03), transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(201, 169, 98, 0.04), transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    /* ----- WATERMARK OVERLAY (visible but tasteful) ----- */
    .watermark-preview {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-28deg);
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 400;
      letter-spacing: 0.3em;
      color: rgba(201, 169, 98, 0.1);
      text-transform: uppercase;
      white-space: nowrap;
      pointer-events: none;
      z-index: 999;
      font-family: 'Cormorant Garamond', serif;
      user-select: none;
      text-shadow: 0 0 12px rgba(201, 169, 98, 0.2);
      animation: watermarkPulse 6s infinite alternate;
    }

    @keyframes watermarkPulse {
      0% { opacity: 0.7; }
      100% { opacity: 1; }
    }

    /* ----- TYPOGRAPHY ----- */
    h1, h2, h3, h4 {
      font-weight: 400;
      letter-spacing: 0.04em;
      line-height: 1.2;
    }

    .section-title {
      font-size: clamp(2.4rem, 6vw, 3.8rem);
      color: var(--gold-light);
      margin-bottom: 1.5rem;
      position: relative;
      display: inline-block;
    }

    .section-title::after {
      content: '';
      display: block;
      width: 70px;
      height: 2px;
      background: var(--gold);
      margin-top: 0.8rem;
      transition: width 0.5s ease;
    }

    .section-title:hover::after {
      width: 120px;
    }

    .subtitle {
      font-size: 1.1rem;
      color: var(--gray-mist);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    /* ----- LAYOUT & CONTAINERS ----- */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem;
      position: relative;
      z-index: 2;
    }

    section {
      padding: 6rem 0;
      position: relative;
    }

    /* ----- BUTTONS & LINKS ----- */
    .btn {
      display: inline-block;
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold-light);
      padding: 1rem 2.5rem;
      font-size: 0.9rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      transition: var(--transition);
      text-decoration: none;
      font-family: 'Cormorant Garamond', serif;
      font-weight: 500;
      position: relative;
      overflow: hidden;
      z-index: 1;
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: var(--gold);
      transition: var(--transition);
      z-index: -1;
    }

    .btn:hover {
      color: var(--black);
      border-color: var(--gold);
      box-shadow: var(--shadow-gold);
    }

    .btn:hover::before {
      left: 0;
    }

    .btn-outline-light {
      border-color: rgba(201, 169, 98, 0.5);
    }

    /* ----- HEADER / NAV ----- */
    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      background: rgba(10, 10, 10, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(201, 169, 98, 0.15);
      transition: var(--transition);
    }

    .logo {
      font-size: 1.6rem;
      letter-spacing: 0.15em;
      color: var(--gold-light);
      text-decoration: none;
      font-weight: 400;
    }

    .logo span {
      color: var(--gold);
    }

    .nav-links {
      display: flex;
      gap: 2.5rem;
      align-items: center;
    }

    .nav-links a {
      color: var(--gray-mist);
      text-decoration: none;
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      transition: var(--transition);
      position: relative;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 0;
      width: 0;
      height: 1px;
      background: var(--gold);
      transition: var(--transition);
    }

    .nav-links a:hover {
      color: var(--gold-light);
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    .menu-toggle {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      flex-direction: column;
      gap: 6px;
      z-index: 110;
    }

    .menu-toggle span {
      width: 28px;
      height: 2px;
      background: var(--gold);
      transition: var(--transition);
    }

    /* ----- HERO SECTION ----- */
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 8rem 0 4rem;
      background: linear-gradient(135deg, #0a0a0a 0%, #111111 50%, #0d0d0d 100%);
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: -20%;
      right: -10%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(201, 169, 98, 0.08), transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .hero-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
      align-items: center;
      position: relative;
      z-index: 2;
    }

    .hero-text h1 {
      font-size: clamp(3.5rem, 8vw, 6rem);
      color: var(--white);
      margin-bottom: 1.2rem;
      line-height: 1.1;
      letter-spacing: 0.02em;
    }

    .hero-text h1 .gold {
      color: var(--gold);
      font-style: italic;
    }

    .hero-sub {
      font-size: 1.2rem;
      color: var(--gray-mist);
      margin-bottom: 2.5rem;
      max-width: 500px;
      line-height: 1.7;
    }

    .hero-art {
      display: flex;
      justify-content: center;
      align-items: center;
      animation: floatSlow 8s ease-in-out infinite;
    }

    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-18px); }
    }

    /* ----- INLINE SVG ARTWORK ----- */
    .hero-svg {
      width: 100%;
      max-width: 500px;
      filter: drop-shadow(0 0 30px rgba(201, 169, 98, 0.25));
    }

    /* ----- ABOUT SECTION ----- */
    .about-section {
      background: var(--black-soft);
      border-top: 1px solid rgba(201, 169, 98, 0.1);
      border-bottom: 1px solid rgba(201, 169, 98, 0.1);
    }

    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
      align-items: start;
    }

    .about-text p {
      margin-bottom: 1.5rem;
      font-size: 1.15rem;
      color: #d4cdc0;
      line-height: 1.8;
    }

    .about-text strong {
      color: var(--gold-light);
      font-weight: 500;
    }

    .about-highlight {
      border-left: 3px solid var(--gold);
      padding-left: 2rem;
      margin: 2rem 0;
      font-style: italic;
      color: var(--gold-light);
      font-size: 1.3rem;
    }

    /* ----- SERVICES SECTION ----- */
    .services-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 2.5rem;
      margin-top: 3rem;
    }

    .service-card {
      background: var(--black-card);
      border: 1px solid rgba(201, 169, 98, 0.15);
      padding: 2.5rem 2rem;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }

    .service-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: var(--gold);
      opacity: 0;
      transition: var(--transition);
    }

    .service-card:hover {
      transform: translateY(-6px);
      border-color: rgba(201, 169, 98, 0.4);
      box-shadow: var(--shadow-gold);
    }

    .service-card:hover::before {
      opacity: 1;
    }

    .service-number {
      font-size: 0.8rem;
      color: var(--gold);
      letter-spacing: 0.3em;
      margin-bottom: 1rem;
      text-transform: uppercase;
    }

    .service-card h3 {
      font-size: 1.8rem;
      color: var(--gold-light);
      margin-bottom: 0.8rem;
    }

    .service-card .tagline {
      font-style: italic;
      color: var(--gold);
      margin-bottom: 1.2rem;
      font-size: 1rem;
    }

    .service-card p {
      color: #c4bcae;
      font-size: 1rem;
      line-height: 1.7;
    }

    /* ----- TESTIMONIALS SECTION ----- */
    .testimonials-section {
      background: var(--black-soft);
      border-top: 1px solid rgba(201, 169, 98, 0.1);
      border-bottom: 1px solid rgba(201, 169, 98, 0.1);
    }

    .testimonials-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2rem;
      margin-top: 3rem;
    }

    .testimonial-card {
      background: var(--black-card);
      padding: 2.5rem 2rem;
      border: 1px solid rgba(201, 169, 98, 0.1);
      position: relative;
      transition: var(--transition);
    }

    .testimonial-card:hover {
      border-color: rgba(201, 169, 98, 0.3);
      box-shadow: var(--shadow-gold);
    }

    .testimonial-card .quote-mark {
      font-size: 4rem;
      color: var(--gold);
      opacity: 0.3;
      line-height: 1;
      margin-bottom: 0.5rem;
      font-family: serif;
    }

    .testimonial-card blockquote {
      font-style: italic;
      color: #d8d0c2;
      font-size: 1.05rem;
      line-height: 1.7;
      margin-bottom: 1.5rem;
    }

    .testimonial-author {
      color: var(--gold);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-size: 0.85rem;
      font-weight: 500;
    }

    /* ----- CONTACT SECTION ----- */
    .contact-section {
      background: linear-gradient(180deg, var(--black) 0%, #0d0d0d 100%);
    }

    .contact-wrapper {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
      margin-top: 3rem;
    }

    .contact-info {
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .contact-item {
      display: flex;
      align-items: flex-start;
      gap: 1.2rem;
    }

    .contact-icon {
      font-size: 1.8rem;
      color: var(--gold);
      min-width: 40px;
      text-align: center;
    }

    .contact-item h4 {
      color: var(--gold-light);
      font-size: 1.1rem;
      letter-spacing: 0.08em;
      margin-bottom: 0.3rem;
    }

    .contact-item p {
      color: var(--gray-mist);
      font-size: 1rem;
    }

    .contact-form {
      background: var(--black-card);
      padding: 3rem;
      border: 1px solid rgba(201, 169, 98, 0.15);
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .form-group label {
      color: var(--gold-light);
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .form-group input,
    .form-group textarea {
      background: transparent;
      border: 1px solid rgba(201, 169, 98, 0.25);
      padding: 1rem;
      color: var(--white);
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      transition: var(--transition);
      outline: none;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 2px rgba(201, 169, 98, 0.15);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 120px;
    }

    /* ----- FOOTER ----- */
    .site-footer {
      background: #050505;
      padding: 2.5rem 0;
      text-align: center;
      border-top: 1px solid rgba(201, 169, 98, 0.1);
      position: relative;
      z-index: 2;
    }

    .site-footer p {
      color: #6b6256;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
    }

    /* ----- ANIMATIONS -----
